<table border="1" style="border-collapse: collapse;text-align: left; color: white; margin-top: 20px;">
            <thead>
                <tr style="background-color: rgba(255, 255, 255, 0.1);">
                    <th style="padding: 10px;">Ordem</th>
                    <th style="padding: 10px;">Nome do Item</th>
                    <th style="padding: 10px;">Quantidade</th>
                    <th style="padding: 10px;">Ação</th>
                </tr>
            </thead>
            <tbody>
                {% for retirada in retiradas %}
                <tr>
                    <td style="padding: 10px;">{{ retirada.id }}</td>
                    <td style="padding: 10px;">{{ retirada.nome }}</td>
                    <td style="padding: 10px;">{{ retirada.quantidade }}</td>
                    <td style="padding: 10px;">{{ retirada.acao }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" style="padding: 10px; text-align: center;">Nenhuma retirada cadastrada.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
