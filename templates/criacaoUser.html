<body style="background-color: rgba(19, 43, 121, 1);">

    <div id="divprincipal"> <!--aqui é o cabeçalho-->
     <h1 class="letras" style="position: absolute; left:710px; top: 50px; ">Novo funcionario</h1> 
     <a href="/login.html">
      <button id="botaoconcluir"   style="position: absolute;top: 50px; left: 50px; width: 100px; height: 40px;"  type="submit" >Voltar</button>

    <div>
<div>
    <h1 class="letras" style="position: absolute; left:710px; top: 280px;">Nome:</h1> 
    <h1 class="letras" style="position: absolute; left:710px; top: 390px;">Função:</h1>
    <h1 class="letras" style="position: absolute; left:710px; top: 510px;">Senha:</h1>
<form action="criacaoUser.html" method="POST" enctype="multipart/form-data">
<div style="margin-left: 710px;"><!--aqui campo do nome-->
    <label for="nome"></label>
    <input id="caixa1" type="text" name="nome" placeholder="Digite o nome do usuario" required>
</div>
<div style="margin-left: 710px;"><!--aqui campo do tipo de useer(adm ou user)-->
    <label for="tipo"></label>
    <select id="caixa2" name="tipo" required>
        <option value="usuario">Usuário</option>
        <option value="admin">Administrador</option>
    </select>
</div>
<div style="margin-left: 710px;"><!--aqui campo da senha-->
    <label for="senha"></label>
    <input id="caixa3" type="password" name="senha" placeholder="Digite a senha" required>
</div>
    <button id="botaoconcluir" style="position: absolute;top: 680px; left: 710px; width: 430px; height: 40px;"  type="submit" >concluir</button>
</form>
